name: Verify distribution

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate living source behavior
        run: python -B -m unittest discover -s tests -v
      - name: Build tracked package projection twice
        run: |
          python tools/build_release.py
          git diff --exit-code -- package/
          python tools/build_release.py
          git diff --exit-code -- package/
      - name: Require the committed package projection to match living source
        run: git diff --exit-code -- package/
      - name: Validate generated public boundary
        run: python -B tools/verify_distribution.py
